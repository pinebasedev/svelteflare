# Deploy pipeline.
#
# The pinebase-deploy-<env> tags record the last deployed commit per
# environment and drive change detection — leave them to the pipeline.
#
# Pushes to `staging` publish the preview app; pushes to `main` publish the
# live app. Until the Cloudflare secrets (CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID) are stored on this repository the pipeline exits
# green without deploying, so early commits never surface as failures.
name: Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Which apps to deploy
        type: choice
        options: [auto, api, web, both]
        default: auto

# One deploy at a time per environment; queued, never cancelled mid-deploy.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # push the pinebase-deploy-<env> tag

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Pinebase connection
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Pinebase has not connected Cloudflare yet - skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags for change detection

      - name: Resolve environment
        if: steps.gate.outputs.configured == 'true'
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.gate.outputs.configured == 'true'
        uses: pnpm/action-setup@v6 # version from the packageManager field

      - name: Set up Node
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # Gitignored local files that type generation and typechecking expect:
      # .dev.vars gives `wrangler types` the secret *names* (never values);
      # .env gives $env/static/public its exports (real values come from the
      # committed .env.staging/.env.production at build time).
      - name: Prepare config stand-ins from examples
        if: steps.gate.outputs.configured == 'true'
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars
          cp apps/web/.env.example apps/web/.env

      # NOTE: apps/marketing is NOT deployed by this pipeline — only the API
      # and web app are. Deploy the marketing site manually with
      # `just deploy-marketing-staging` / `just deploy-marketing-production`.
      #
      # Decide api / web / both. Change detection compares HEAD against the
      # last successfully deployed commit (pinebase-deploy-<env> tag) using
      # turbo's workspace graph. Any doubt => deploy both.
      - name: Decide what to deploy
        if: steps.gate.outputs.configured == 'true'
        id: plan
        run: |
          WANT="${{ github.event.inputs.deploy || 'auto' }}"
          API=true; WEB=true
          if [ "$WANT" = "api" ]; then WEB=false; fi
          if [ "$WANT" = "web" ]; then API=false; fi
          TAG="pinebase-deploy-${{ steps.target.outputs.env }}"
          if [ "$WANT" = "auto" ]; then
            if BASE=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}") \
               && [ "$BASE" != "$GITHUB_SHA" ] \
               && NAMES=$(TURBO_SCM_BASE="$BASE" pnpm --silent exec turbo ls --affected --output=json \
                          | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(d.packages.items.map(p=>p.name).join('\n'))"); then
              echo "$NAMES" | grep -qx '@repo/api' || API=false
              echo "$NAMES" | grep -qx '@repo/web' || WEB=false
            fi
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "Deploy plan: api=$API web=$WEB"

      # Quality gates always run for the whole monorepo: build:<env> pulls in
      # clean, cf-typegen, check, format and lint through turbo's task graph.
      - name: Build and verify (lint, format, typecheck, build)
        if: steps.gate.outputs.configured == 'true'
        run: pnpm exec turbo run build:${{ steps.target.outputs.env }}

      - name: Apply database migrations
        if: steps.gate.outputs.configured == 'true' && steps.plan.outputs.api == 'true'
        run: pnpm --filter @repo/api run migrate:${{ steps.target.outputs.env }}

      - name: Deploy API
        if: steps.gate.outputs.configured == 'true' && steps.plan.outputs.api == 'true'
        # Plain `wrangler deploy`: the Cloudflare vite plugin's build output
        # (from build:<env> above) redirects wrangler to the env-resolved config.
        run: pnpm --filter @repo/api exec wrangler deploy

      - name: Deploy web app
        if: steps.gate.outputs.configured == 'true' && steps.plan.outputs.web == 'true'
        run: pnpm --filter @repo/web run deploy:${{ steps.target.outputs.env }}

      - name: Record deployed commit
        if: steps.gate.outputs.configured == 'true'
        run: |
          git tag -f "pinebase-deploy-${{ steps.target.outputs.env }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/pinebase-deploy-${{ steps.target.outputs.env }}"
