# One preview environment per open pull request into `staging`: Alchemy stage
# `pr-{number}`, redeployed on every push, destroyed when the PR closes. Each
# deploy is reported to project-ops once IDP_API_URL is set.
#
# Exits green without doing anything until the Cloudflare secrets exist, so
# early PRs never show as failures. Secrets and variables: see README.md,
# "Deploying". GITHUB_TOKEN (automatic) lets the stack post the preview comment.

name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [staging]

# One run at a time per PR; queued, never cancelled mid-deploy.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

# `alchemy destroy` evaluates the stack too, so both jobs get the full config.
env:
  STAGE: pr-${{ github.event.number }}
  PULL_REQUEST: ${{ github.event.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
  PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
  EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
  EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
  CF_ACCESS_ALLOW_EMAIL: ${{ secrets.CF_ACCESS_ALLOW_EMAIL }}
  CF_GOOGLE_IDP_ID: ${{ vars.CF_GOOGLE_IDP_ID }}
  CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm --filter @repo/api test
      - run: pnpm lint
      - run: pnpm format:check

  deploy:
    needs: check
    # The template repository itself never deploys; projects made from it do.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      IDP_API_URL: ${{ vars.IDP_API_URL }}
      IDP_PROJECT_TOKEN: ${{ secrets.IDP_PROJECT_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check Cloudflare connection
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare is not connected yet - skipping the preview deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.configured == 'true'

      - uses: ./.github/actions/setup
        if: steps.gate.outputs.configured == 'true'

      - name: Register deployment
        id: register
        if: steps.gate.outputs.configured == 'true' && env.IDP_API_URL != ''
        run: |
          id=$(scripts/project-ops.sh register "$STAGE" ephemeral "$GITHUB_SHA" "$PULL_REQUEST")
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec alchemy deploy --stage "$STAGE" --yes

      - name: Mark deployment done
        if: success() && steps.register.outputs.deployment_id != ''
        run: |
          scripts/project-ops.sh complete "${{ steps.register.outputs.deployment_id }}" "done" \
            "$(node scripts/web-url.mjs)"

      - name: Mark deployment failed
        if: failure() && steps.register.outputs.deployment_id != ''
        run: scripts/project-ops.sh complete "${{ steps.register.outputs.deployment_id }}" failed

  cleanup:
    if: github.event.action == 'closed' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check Cloudflare connection
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare is not connected yet - nothing to tear down."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # This job must only ever destroy a pr-* stage.
      - name: Guard against destroying a persistent stage
        if: steps.gate.outputs.configured == 'true'
        run: |
          case "$STAGE" in
            pr-[0-9]*) ;;
            *) echo "ERROR: refusing to destroy '$STAGE'."; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        if: steps.gate.outputs.configured == 'true'

      - uses: ./.github/actions/setup
        if: steps.gate.outputs.configured == 'true'

      - name: Destroy
        if: steps.gate.outputs.configured == 'true'
        run: pnpm exec alchemy destroy --stage "$STAGE" --yes
