# Deploys one persistent stage (`staging` or `prod`) and reports it to
# project-ops. Called by staging.yml and production.yml; never destroys
# anything.
#
# Exits green without doing anything until the Cloudflare secrets exist.
# Secrets and variables: see README.md, "Deploying".

name: Deploy stage

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      kind:
        description: project-ops environment kind (staging | production)
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A GitHub Environment per stage: secrets set on `production` (live-mode
    # Stripe keys, prod's BETTER_AUTH_SECRET, ...) override the repository-level
    # ones, which serve `staging` and previews.
    environment: ${{ inputs.stage == 'prod' && 'production' || 'staging' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STAGE: ${{ inputs.stage }}
      # On a `pull_request` event `github.sha` is the PR branch's head, not the
      # merge commit that landed.
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      PROJECT_OPS_URL: ${{ vars.PROJECT_OPS_URL }}
      PROJECT_OPS_TOKEN: ${{ secrets.PROJECT_OPS_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PROD_API_DOMAIN: ${{ vars.PROD_API_DOMAIN }}
      PROD_APP_DOMAIN: ${{ vars.PROD_APP_DOMAIN }}
      PROD_MARKETING_DOMAIN: ${{ vars.PROD_MARKETING_DOMAIN }}
    steps:
      - name: Check Cloudflare connection
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare is not connected yet - skipping the $STAGE deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.configured == 'true'
        with:
          ref: ${{ env.SHA }}

      - uses: ./.github/actions/setup
        if: steps.gate.outputs.configured == 'true'

      - name: Register deployment
        id: register
        if: steps.gate.outputs.configured == 'true' && env.PROJECT_OPS_URL != ''
        run: |
          id=$(scripts/project-ops.sh register "$STAGE" "${{ inputs.kind }}" "$SHA")
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        env:
          GITHUB_SHA: ${{ env.SHA }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          CF_ACCESS_ALLOW_EMAIL: ${{ secrets.CF_ACCESS_ALLOW_EMAIL }}
          CF_GOOGLE_IDP_ID: ${{ vars.CF_GOOGLE_IDP_ID }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
        run: pnpm exec alchemy deploy --stage "$STAGE" --yes

      - name: Mark deployment done
        if: success() && steps.register.outputs.deployment_id != ''
        run: |
          scripts/project-ops.sh complete "${{ steps.register.outputs.deployment_id }}" "done" \
            "$(node scripts/web-url.mjs)"

      - name: Mark deployment failed
        if: failure() && steps.register.outputs.deployment_id != ''
        run: scripts/project-ops.sh complete "${{ steps.register.outputs.deployment_id }}" failed
